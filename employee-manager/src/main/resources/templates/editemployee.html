<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Employee</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; }
    input { padding: 6px; margin: 4px 0; width: 300px; }
    .err { color: red; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Edit Employee</h1>
  <form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post">
    <div><input th:field="*{fullName}"><div class="err" th:errors="*{fullName}"></div></div>
    <div><input th:field="*{email}"><div class="err" th:errors="*{email}"></div></div>
    <div><input th:field="*{phone}"><div class="err" th:errors="*{phone}"></div></div>
    <div><input th:field="*{department}"><div class="err" th:errors="*{department}"></div></div>
    <div><input th:field="*{salary}" type="number" step="0.01"><div class="err" th:errors="*{salary}"></div></div>
    <button type="submit">Update Employee</button>
    <a th:href="@{/employees}">Cancel</a>
  </form>
</body>
</html>
